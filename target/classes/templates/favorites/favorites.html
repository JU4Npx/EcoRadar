<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Favoritos - EcoRadar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/EcoRadarLogoSemNome.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">
    <div class="card shadow-lg border-0">
        <div class="card-header bg-success text-white text-center">
            <h3><i class="bi bi-heart-fill"></i> Meus Favoritos</h3>
        </div>
        <div class="card-body p-4">
            <!-- Se não houver favoritos -->
            <div th:if="${#lists.isEmpty(favoritos)}" class="alert alert-info text-center">
                <p>Você ainda não tem nenhuma área verde favoritada.</p>
                <a href="/home" class="btn btn-success">Voltar para Home e Favoritar</a>
            </div>

            <!-- Se houver favoritos, renderizar os cards -->
            <div th:if="${!#lists.isEmpty(favoritos)}" class="row">
                <div class="col-md-6 col-lg-4 mb-4" th:each="area : ${favoritos}">
                    <div class="card h-100 shadow-sm border-0 favorite-card">
                        <div class="card-body">
                            <!-- Nome da área -->
                            <h5 class="card-title text-success" th:text="${area.name}"></h5>

                            <!-- Endereço -->
                            <div class="mb-3 text-muted small">
                                <i class="bi bi-geo-alt"></i>
                                <span th:text="${area.address != null ? area.address.street + ', ' + area.address.city : 'Endereço não informado'}"></span>
                            </div>

                            <!-- Descrição -->
                            <p class="card-text" th:text="${area.description}"></p>

                            <!-- Tipo de área -->
                            <div class="mb-3">
                                <span class="badge bg-success" th:text="${area.type}"></span>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent text-center d-flex gap-2 flex-column">
                            <div class="d-flex gap-2">
                                <a th:href="@{/map(areaId=${area.id})}" class="btn btn-outline-success flex-grow-1 btn-sm">
                                    <i class="bi bi-map"></i> Ver no Mapa
                                </a>
                                <button class="btn btn-outline-danger btn-sm remove-favorite-btn"
                                        th:data-area-id="${area.id}"
                                        type="button">
                                    <i class="bi bi-trash"></i> Remover
                                </button>
                            </div>
                            <a th:href="@{/areas-verdes/{id}/eventos(id=${area.id})}" class="btn btn-success btn-sm mt-2 w-100">
                                <i class="bi bi-calendar-event"></i> Visualizar Eventos
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Remover favorito
    document.querySelectorAll('.remove-favorite-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            const areaId = this.getAttribute('data-area-id');
            try {
                const resp = await fetch(`/api/favorites/${areaId}`, {
                    method: 'DELETE'
                });
                if (resp.ok) {
                    // Recarregar a página para atualizar a lista
                    window.location.reload();
                } else {
                    alert('Erro ao remover favorito');
                }
            } catch (e) {
                console.error('Erro:', e);
                alert('Erro ao remover favorito');
            }
        });
    });
</script>
</body>
</html>
