<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/EcoRadarLogoSemNome.png">
    <title>Meu perfil — EcoRadar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page-shell profile-page">
    <div class="container">
        <div class="page-intro"><span class="eyebrow eyebrow-soft"><i class="bi bi-person"></i> Sua conta</span><h1>Meu perfil</h1><p>Confira seus dados e acesse rapidamente seus espaços salvos.</p></div>
        <section class="profile-card">
            <div class="profile-cover"><span></span><span></span></div>
            <div class="profile-content">
                <div class="profile-main">
                    <div class="profile-avatar-large"
                         th:text="${#strings.substring((loggedUser.name != null and !#strings.isEmpty(loggedUser.name)) ? loggedUser.name : loggedUser.email, 0, 1)}">U</div>
                    <div><span class="profile-badge"><i class="bi bi-patch-check-fill"></i> Conta EcoRadar</span><h2 th:text="${loggedUser.name}">Usuário</h2><p th:text="${loggedUser.email}">usuario@exemplo.com</p></div>
                </div>
                <div class="profile-details">
                    <article><span><i class="bi bi-envelope"></i></span><div><small>E-mail cadastrado</small><strong th:text="${loggedUser.email}">usuario@exemplo.com</strong></div></article>
                    <article><span><i class="bi bi-shield-check"></i></span><div><small>Tipo de conta</small><strong th:text="${loggedUser.type}">Usuário</strong></div></article>
                </div>
                <div class="profile-actions"><a th:href="@{/favorites}" class="btn btn-primary"><i class="bi bi-heart"></i> Ver meus favoritos</a><a th:href="@{/logout}" class="btn btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Sair da conta</a></div>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
